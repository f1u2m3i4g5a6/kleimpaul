<!doctype html>
<html lang="pt-BR" data-company="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Orçamento / Ordem de Serviço | Kleimpaul</title>
<style>
:root{--ink:#171a1f;--muted:#697480;--line:#dfe3e7;--paper:#fff;--soft:#f6f7f8;--accent:#ee650b;--accent-soft:#fff3ea}*{box-sizing:border-box}html{background:#e7eaed}body{margin:0;background:linear-gradient(145deg,#e9ecef,#dfe3e7);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:center;gap:7px;padding:10px;background:rgba(13,17,22,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}.toolbar button,.toolbar a{min-height:38px;border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:8px 13px;background:#171d24;color:#e7ebef;text-decoration:none;font-weight:750;font-size:12px;cursor:pointer}.toolbar .primary{background:linear-gradient(135deg,#ee650b,#ff8533);border-color:transparent;color:#fff;box-shadow:0 9px 24px rgba(238,101,11,.2)}.page{position:relative;width:min(210mm,calc(100% - 24px));min-height:297mm;margin:20px auto;padding:14mm 14mm;background:var(--paper);box-shadow:0 28px 75px rgba(25,31,38,.17);border-radius:4px;overflow:hidden}.page:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#ee650b,#ff9c5c 42%,#171a1f 42%,#171a1f 100%)}.top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;padding:2mm 0 13px;border-bottom:1px solid #222831}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain;border:1px solid var(--line);border-radius:9px;background:#fff}.brand h1{margin:0;font-size:20px;letter-spacing:-.04em}.brand p{margin:4px 0 0;color:var(--muted);font-size:8.5px}.doc{text-align:right}.doc .type{display:inline-flex;padding:5px 8px;border:1px solid #ffd4b8;background:var(--accent-soft);color:#a34409;border-radius:6px;font-size:7px;font-weight:850;text-transform:uppercase;letter-spacing:.1em}.doc strong{display:block;margin-top:7px;font-size:18px;letter-spacing:-.03em}.doc small{color:var(--muted);font-size:8px}.status{display:inline-flex;margin-top:6px;padding:4px 6px;border-radius:5px;background:#f0f2f4;color:#59636e;font-size:6.5px;font-weight:850;text-transform:uppercase;letter-spacing:.06em}.info-row{display:grid;grid-template-columns:1.3fr .7fr;gap:8px;margin-top:10px}.box{border:1px solid var(--line);border-radius:7px;padding:9px 10px;min-height:60px;background:#fff}.label{display:block;margin-bottom:4px;color:#78828d;font-size:6.2px;font-weight:850;text-transform:uppercase;letter-spacing:.11em}.box strong{font-size:10.5px}.box p{margin:3px 0;color:#3d454e;font-size:8.2px;line-height:1.48}.section-title{position:relative;margin:15px 0 7px;padding:0 0 6px 11px;border-bottom:1px solid var(--line);font-size:8px;text-transform:uppercase;letter-spacing:.12em}.section-title:before{content:"";position:absolute;left:0;top:1px;width:3px;height:9px;border-radius:99px;background:var(--accent)}.machine-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mini{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--soft)}.mini span{display:block;color:#7b8590;font-size:5.9px;text-transform:uppercase;font-weight:850;letter-spacing:.05em}.mini b{display:block;margin-top:3px;font-size:8.5px;word-break:break-word}.text-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.text-block{border:1px solid var(--line);border-radius:6px;padding:8px 9px}.text-block.wide{grid-column:1/-1}.text-block p{margin:0;font-size:8.1px;line-height:1.52;color:#303740}table{width:100%;border-collapse:separate;border-spacing:0;margin-top:7px;border:1px solid var(--line);border-radius:7px;overflow:hidden}th,td{padding:7px 6px;border-bottom:1px solid var(--line);font-size:7.7px;text-align:left;vertical-align:top}th{font-size:6px;text-transform:uppercase;letter-spacing:.08em;color:#707b86;background:#f4f5f6}tbody tr:last-child td{border-bottom:0}td.num,th.num{text-align:right;white-space:nowrap}.item-name{font-weight:750;font-size:8.2px}.item-thumb{width:30px;height:30px;object-fit:cover;border:1px solid var(--line);border-radius:5px;float:left;margin:0 6px 3px 0}.item-note{display:block;color:var(--muted);font-size:6.4px;margin-top:2px}.kind{display:inline-block;margin-right:4px;padding:2px 4px;border:1px solid #f4c9ac;border-radius:4px;background:#fff7f1;color:#9d4d1d;font-size:5.3px;font-weight:800;text-transform:uppercase}.totals{width:290px;margin:10px 0 0 auto;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:#fafafa}.totals div{display:flex;justify-content:space-between;gap:15px;padding:5px 0;border-bottom:1px solid var(--line);font-size:7.7px}.totals .grand{font-size:13px;font-weight:850;border-bottom:0;padding-top:8px;color:#b84e0b}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.photos img{width:100%;height:82px;object-fit:cover;border:1px solid var(--line);border-radius:6px}.approval{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:15px}.signature{height:58px;border-top:1px solid #2f353c;margin-top:38px;padding-top:5px;text-align:center;color:var(--muted);font-size:6.5px}.footer{margin-top:15px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#87919b;font-size:6.2px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}@media print{html,body{background:#fff}.toolbar{display:none}.page{width:100%;min-height:auto;margin:0;padding:8mm 8mm;box-shadow:none;border-radius:0}.photos img{height:72px}.section-title{break-after:avoid}tr{break-inside:avoid}.page{print-color-adjust:exact;-webkit-print-color-adjust:exact}}@media(max-width:720px){.page{padding:20px 14px}.info-row,.text-grid,.approval{grid-template-columns:1fr}.machine-grid{grid-template-columns:1fr 1fr}.top{grid-template-columns:1fr}.doc{text-align:left}.photos{grid-template-columns:1fr 1fr}}

/* APEX document refinement */
body.apex-order{background:radial-gradient(900px 520px at 50% 0%,rgba(238,101,11,.10),transparent 64%),linear-gradient(145deg,#e8ebee,#d9dee3)}
.toolbar{padding:12px;box-shadow:0 16px 50px rgba(0,0,0,.16)}.toolbar button,.toolbar a{min-height:42px;border-radius:11px;padding:9px 16px}.page{margin:28px auto;padding:15mm 15mm;border-radius:8px;box-shadow:0 38px 110px rgba(20,28,36,.2)}.page:before{height:5px;background:linear-gradient(90deg,#ee650b 0,#ff9b5a 30%,#1a2027 30%,#1a2027 100%)}.page:after{content:"KLEIMPAUL";position:absolute;right:-9mm;bottom:20mm;transform:rotate(-90deg);font-size:7px;letter-spacing:.3em;font-weight:900;color:#e9ecef;pointer-events:none}.top{padding-bottom:16px}.brand img{width:52px;height:52px;border-radius:11px}.brand h1{font-size:22px}.doc .type{border-radius:7px;padding:6px 9px}.doc strong{font-size:20px}.box{border-radius:9px;padding:10px 11px}.mini{border-radius:8px}.text-block{border-radius:8px}table{border-radius:9px}.totals{border-radius:9px;background:linear-gradient(145deg,#fafafa,#f5f6f7)}.photos img{border-radius:8px}.signature{color:#727d87}.footer{font-weight:650}
@media print{body.apex-order{background:#fff}.page:after{color:#f0f1f2}.page{border-radius:0}}

</style>
</head>
<body class="apex-order">
<div class="toolbar"><a href="admin.html">Voltar</a><button class="primary" onclick="window.print()">Imprimir</button></div>
<main class="page" id="page"><div class="empty">Carregando documento...</div></main>
<script type="module">
import { FIREBASE_CONFIG, DEFAULT_COMPANY_ID, adminEmail } from './firebase-config.js';
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
const app=getApps().length?getApps()[0]:initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app),companyId=DEFAULT_COMPANY_ID,EXPECTED=adminEmail('diva','1');
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fmt=d=>{if(!d)return'-';const x=new Date(d+'T12:00:00');return Number.isNaN(x.getTime())?d:x.toLocaleDateString('pt-BR')};
const status=v=>({rascunho:'Rascunho',aguardando:'Aguardando aprovação',aprovado:'Aprovado',execucao:'Em execução',concluido:'Concluído',recusado:'Recusado',cancelado:'Cancelado'})[v]||v||'-',kind=v=>({part:'Peça',labor:'Mão de obra',service:'Serviço',other:'Outro'})[v]||v||'-';
async function mediaSrc(ref){if(!String(ref||'').startsWith('media:'))return'';try{const s=await getDoc(doc(db,'empresas',companyId,'media',String(ref).slice(6)));return s.exists()?s.data().dataUrl||s.data().url||'':''}catch{return''}}
async function getOrder(){const p=new URLSearchParams(location.search);if(p.get('draft')==='1'){try{return JSON.parse(localStorage.getItem('kleimpaul_work_order_draft')||'null')}catch{return null}}const id=p.get('id');if(!id)return null;const s=await getDoc(doc(db,'empresas',companyId,'work_orders',id));return s.exists()?{id:s.id,...s.data()}:null}
const txt=(label,value)=>value?`<div class="text-block"><span class="label">${label}</span><p>${esc(value).replace(/\n/g,'<br>')}</p></div>`:'';
const mini=(label,value)=>value?`<div class="mini"><span>${label}</span><b>${esc(value)}</b></div>`:'';
async function render(x){if(!x){document.getElementById('page').innerHTML='<div class="empty"><h2>Documento não encontrado</h2><p>Abra novamente pelo painel.</p></div>';return}const settings=await getDoc(doc(db,'empresas',companyId,'site_settings','config')).catch(()=>null),cfg=settings?.exists()?settings.data():{},logo=await mediaSrc(cfg.logoUrl),photos=(await Promise.all((x.photos||[]).map(mediaSrc))).filter(Boolean),c=x.customer||{},m=x.machine||{},items=x.items||[],itemImages=await Promise.all(items.map(i=>mediaSrc(i.image))),parts=Number(x.partsTotal||0),labor=Number(x.laborTotal||0),services=Number(x.servicesTotal||0),subtotal=Number(x.subtotal??parts+labor+services),discount=Number(x.discount||0),total=Number(x.total??Math.max(0,subtotal-discount)),priced=items.some(i=>i.priceProvided!==false&&(Number(i.unitPrice||0)>0||Number(i.discount||0)>0))||discount>0;document.title=`${x.number||'Documento'} | Kleimpaul`;
const rows=items.map((i,n)=>`<tr><td>${n+1}</td><td>${itemImages[n]?`<img class="item-thumb" src="${esc(itemImages[n])}" alt="">`:''}<span class="kind">${esc(kind(i.kind))}</span><span class="item-name">${esc(i.description)}</span>${i.notes?`<span class="item-note">${esc(i.notes)}</span>`:''}</td><td>${esc(i.sku||'-')}</td><td class="num">${Number(i.qty||0)}</td><td class="num">${i.priceProvided===false?'—':money(i.unitPrice)}</td><td class="num">${Number(i.discount||0)?money(i.discount):'—'}</td><td class="num"><b>${i.priceProvided===false?'—':money(Math.max(0,Number(i.qty||0)*Number(i.unitPrice||0)-Number(i.discount||0)))}</b></td></tr>`).join('')||'<tr><td colspan="7">Nenhum item informado.</td></tr>';
document.getElementById('page').innerHTML=`<header class="top"><div class="brand">${logo?`<img src="${esc(logo)}" alt="">`:''}<div><h1>${esc(cfg.companyName||'Alderico Kleimpaul')}</h1><p>Equipamentos, peças e assistência técnica</p></div></div><div class="doc"><span class="type">${x.documentType==='os'?'Ordem de Serviço':'Orçamento'}</span><strong>${esc(x.number||'-')}</strong><small>${fmt(x.date)}</small><br><span class="status">${esc(status(x.status))}</span></div></header>
<section class="info-row"><div class="box"><span class="label">Cliente</span><strong>${esc(c.code?c.code+' • ':'')}${esc(c.name||'-')}</strong><p>${esc(c.document||'')}${c.phone?' • '+esc(c.phone):''}<br>${esc(c.email||'')}${c.address?'<br>'+esc(c.address):''}</p></div><div class="box"><span class="label">Atendimento</span><strong>${esc(x.technician||'Não informado')}</strong><p>Prioridade: ${esc(x.priority||'normal')}<br>Validade: ${fmt(x.validUntil)}<br>Previsão: ${fmt(x.expectedDate)}</p></div></section>
<h2 class="section-title">Máquina</h2><section class="machine-grid">${mini('Tipo',m.type)}${mini('Marca',m.brand)}${mini('Modelo',m.model)}${mini('Nº de série',m.serial)}${mini('Nº do motor',m.engineNumber)}${mini('Patrimônio',m.asset)}${mini('Ano',m.year)}${mini('Horímetro',m.hourMeter)}${mini('Combustível',m.fuel)}${mini('Condição de entrada',m.condition)}${mini('Acessórios',m.accessories)}${Number(x.warrantyDays||0)?mini('Garantia do serviço',x.warrantyDays+' dias'):''}</section>
${[x.complaint,x.diagnosis,x.requestedWork,x.performedWork].some(Boolean)?`<h2 class="section-title">Atendimento técnico</h2><section class="text-grid">${txt('Defeito informado',x.complaint)}${txt('Diagnóstico',x.diagnosis)}${txt('Serviço solicitado',x.requestedWork)}${txt('O que foi feito',x.performedWork)}</section>`:''}
<h2 class="section-title">Peças, serviços e mão de obra</h2><table><thead><tr><th>#</th><th>Descrição</th><th>Código</th><th class="num">Qtd.</th><th class="num">Unitário</th><th class="num">Desc.</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table>${priced?`<div class="totals"><div><span>Peças</span><b>${money(parts)}</b></div><div><span>Mão de obra</span><b>${money(labor)}</b></div>${services?`<div><span>Serviços / outros</span><b>${money(services)}</b></div>`:''}${discount?`<div><span>Desconto</span><b>${money(discount)}</b></div>`:''}<div class="grand"><span>Total</span><b>${money(total)}</b></div></div>`:''}
${photos.length?`<h2 class="section-title">Fotos</h2><div class="photos">${photos.map(src=>`<img src="${esc(src)}" alt="Registro da máquina">`).join('')}</div>`:''}
${x.publicNotes?`<h2 class="section-title">Observações</h2><div class="box"><p>${esc(x.publicNotes).replace(/\n/g,'<br>')}</p></div>`:''}
${x.approval?.name||x.approval?.date||x.approval?.method?`<h2 class="section-title">Aprovação</h2><div class="box"><strong>${esc(x.approval?.name||'-')}</strong><p>${esc(x.approval?.method||'')}${x.approval?.date?' • '+fmt(x.approval.date):''}${x.approval?.notes?'<br>'+esc(x.approval.notes):''}</p></div>`:''}
<section class="approval"><div class="signature">Assinatura / aprovação do cliente</div><div class="signature">Responsável Kleimpaul</div></section><footer class="footer"><span>${esc(cfg.companyName||'Alderico Kleimpaul')}</span><span>Gerado em ${new Date().toLocaleString('pt-BR')}</span></footer>`}
onAuthStateChanged(auth,async user=>{if(user?.email?.toLowerCase()!==EXPECTED){document.getElementById('page').innerHTML='<div class="empty"><h2>Acesso restrito</h2><p>Abra este documento a partir do painel administrativo.</p></div>';return}render(await getOrder())});
</script>
</body></html>
